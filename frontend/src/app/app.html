<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header shell">
  <a class="brand" routerLink="/" aria-label="Padel Americano home">
    <span class="brand-mark" aria-hidden="true">pa.</span>
    <span>Padel <strong>Americano</strong></span>
  </a>
  <div class="header-actions">
    <span class="badge">Local-only prototype</span>
    <div class="navigation" #navigation (focusout)="closeMenuOnFocusOut($event)">
      <button
        type="button"
        class="menu-button"
        #menuButton
        aria-controls="main-navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="menuOpen.set(!menuOpen())"
      >
        <span class="burger" aria-hidden="true"><span></span><span></span><span></span></span>
        Menu
      </button>
      <nav
        id="main-navigation"
        class="header-nav"
        aria-label="Main navigation"
        [hidden]="!menuOpen()"
      >
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          >Your court</a
        >
        <a
          class="nav-link"
          routerLink="/session/new"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          >Session setup</a
        >
        <a
          class="nav-link"
          routerLink="/players"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="menuOpen.set(false)"
          >Players</a
        >
      </nav>
    </div>
  </div>
</header>
<main id="main-content" class="shell" tabindex="-1">
  <router-outlet />
</main>
<footer class="shell">Made for your regular game. Development preview · no shared data.</footer>
