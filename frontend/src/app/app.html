<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  @if (!auth.shared || (auth.ready() && auth.signedIn())) {
    <nav class="header-nav" aria-label="Main navigation">
      <a
        class="nav-link"
        routerLink="/"
        [class.active]="clubhouseActive()"
        [attr.aria-current]="clubhouseActive() ? 'page' : null"
        >Clubhouse</a
      >
      <a
        class="nav-link"
        routerLink="/session/new"
        [class.active]="sessionActive()"
        [attr.aria-current]="sessionActive() ? 'page' : null"
        >Session</a
      >
      <a
        class="nav-link"
        routerLink="/players"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >Players</a
      >
    </nav>
  }
</header>
<main id="main-content" class="shell" tabindex="-1">
  @if (auth.shared && !auth.ready()) {
    <p role="status">Restoring sign-in…</p>
  }
  <router-outlet />
</main>
<footer class="shell">
  <a class="brand" routerLink="/" aria-label="padel for fun home">
    <span class="brand-mark" aria-hidden="true">pff.</span>
    <strong>padel for fun</strong>
  </a>
  <p>Made for your regular game.</p>
</footer>
